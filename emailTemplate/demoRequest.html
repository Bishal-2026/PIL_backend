<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Demo Request</title>
    <style>
        .header {
            background: #ffffff;
            color: #004aad;
            padding: 18px;
            text-align: center;
        }
        .logo {
            height: 90px;
            max-width: 160px;
            display: block;
            margin: 0 auto 8px;
        }
        .field-label {
            font-weight: bold;
            color: #004aad;
            margin-bottom: 4px;
            display: block;
            font-size: 14px;
        }
        .field-value {
            background: #f1f7ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 15px;
            color: #333333;
            border: 1px solid #e1efff;
        }
        @media only screen and (max-width:480px) {
            .container {
                width: 100% !important
            }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color:#eef1f5; font-family:Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:30px 0;">
        <tr>
            <td align="center">
                <!-- Main Card -->
                <table width="600" cellpadding="0" cellspacing="0" class="container"
                    style="width:600px; max-width:600px; background:#ffffff; border-radius:10px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,0.08);">

                    <!-- Header -->
                    <tr>
                        <td class="header" align="center" style="padding: 18px 15px; background:#ffffff; color:#004aad;">
                            <img src="cid:pidilite-logo" alt="PIL Logo" class="logo" style="height:90px; max-width:160px;" />
                            <div style="font-size:18px; font-weight:700; margin-top:4px; color:#004aad;">New Demo Request Received</div>
                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td style="height:4px; background:#eef1f5;"></td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding:30px; color:#333333;">
                            <div style="font-weight: bold; color: #004aad; margin-bottom: 4px; display: block; font-size: 14px;">Full Name</div>
                            <div style="background: #f1f7ff; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 15px; color: #333333; border: 1px solid #e1efff;">{{name}}</div>

                            <div style="font-weight: bold; color: #004aad; margin-bottom: 4px; display: block; font-size: 14px;">Company</div>
                            <div style="background: #f1f7ff; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 15px; color: #333333; border: 1px solid #e1efff;">{{company}}</div>

                            <div style="font-weight: bold; color: #004aad; margin-bottom: 4px; display: block; font-size: 14px;">Work Email</div>
                            <div style="background: #f1f7ff; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 15px; color: #333333; border: 1px solid #e1efff;">{{email}}</div>

                            <div style="font-weight: bold; color: #004aad; margin-bottom: 4px; display: block; font-size: 14px;">Demo Requested?</div>
                            <div style="background: #f1f7ff; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 15px; color: #333333; border: 1px solid #e1efff;">{{requestDemo}}</div>

                            <div style="font-weight: bold; color: #004aad; margin-bottom: 4px; display: block; font-size: 14px;">Message / Requirements</div>
                            <div style="background: #f1f7ff; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 15px; color: #333333; border: 1px solid #e1efff; white-space: pre-wrap;">{{message}}</div>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background:#f1f3f6; padding:18px; text-align:center;">
                            <p style="font-size:12px; color:#777777; margin:0;">
                                © 2026 Ajiva Infotech Pvt. Ltd. All rights reserved.
                            </p>
                            <p style="font-size:12px; color:#777777; margin:8px 0 0;">
                                This is an automated notification from the PIL Platform Landing Page.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
